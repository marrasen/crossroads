name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Vet, test, build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
        env:
          CGO_ENABLED: 1
        if: runner.os == 'Linux'
      - name: Test
        run: go test ./...
        if: runner.os == 'Windows'
      - name: Build without cgo
        run: go build ./...
        env:
          CGO_ENABLED: 0

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          install-mode: goinstall
      - name: Lint for Windows
        run: GOOS=windows "$(go env GOPATH)/bin/golangci-lint" run ./...
