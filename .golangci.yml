version: "2"

run:
  tests: true

linters:
  default: none
  exclusions:
    rules:
      # A type assertion that fails in a test fails the test, loudly and
      # on the line that made it, which is what a test wants. In the
      # library it would take a window down, which is why the check
      # stays on everywhere else.
      - path: _test\.go
        linters:
          - forcetypeassert
      # A test helper takes the arguments its tests need, and gives back
      # what they read. One that happens to be called the same way twice
      # is not a signature to tighten.
      - path: _test\.go
        linters:
          - unparam
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment   # readability of a struct beats its padding here
        - shadow           # "if err := f(); err != nil" is Go, not a mistake
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    exhaustive:
      default-signifies-exhaustive: true
      # input.Key is the whole keyboard. A control switching on three of
      # its keys is the ordinary shape, not a case left out.
      ignore-enum-types: "input\\.Key"
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers", "sayRepetitiveInsteadOfStutters"]
        - name: package-comments
        - name: indent-error-flow
        - name: var-naming
        - name: errorf
        - name: context-as-argument
        - name: range-val-address
        - name: unexported-return
        - name: early-return
        - name: unnecessary-stmt
        - name: superfluous-else
        - name: confusing-naming
        - name: bare-return
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - opinionated
      disabled-checks:
        - whyNoLint
        - hugeParam        # geom.Size and Frame are meant to travel by value
        - rangeValCopy
        # A type belongs where its story is told, which in a long file is
        # among the methods that tell it rather than at the top.
        - typeDefFirst
  enable:
    # Correctness
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errorlint        # wrapped errors: demands errors.Is / errors.As over ==
    - nilerr
    - nilnesserr
    - forcetypeassert
    - exhaustive       # every case of an enum like Presence
    - bodyclose
    - noctx
    - makezero
    - durationcheck
    - reassign
    - recvcheck        # mixed value/pointer receivers
    - protogetter
    - zerologlint

    # API and style for a library
    - revive
    - gocritic
    - godot            # comments end in a period
    - misspell
    - predeclared
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
    - copyloopvar
    - intrange
    - perfsprint
    - prealloc
    - iface
    - nakedret
    - dupword
    # gochecknoinits stays off: registering an intent type for the wire
    # in an init function is the pattern gunim documents, the same shape
    # as image.RegisterFormat and a database/sql driver.

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
